<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MacBanda – Setlist</title>

<style>
    body {
        background: #000;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h1 {
        font-size: 2.4rem;
        color: #db0c2a;
        text-shadow: 0 0 8px #db0c2a, 0 0 18px #ff002b;
        margin-bottom: 25px;
        text-align: center;
    }

    .form-box {
        background: #111;
        padding: 20px;
        border-radius: 14px;
        width: 100%;
        max-width: 500px;
        margin-bottom: 25px;
        box-shadow: 0 0 18px rgba(219,12,42,0.6);
    }

    label {
        display: block;
        font-weight: bold;
        margin-top: 10px;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 8px;
        border: none;
        outline: none;
        background: #222;
        color: #fff;
    }

    button {
        margin-top: 15px;
        width: 100%;
        padding: 12px;
        background: #db0c2a;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        cursor: pointer;
        box-shadow: 0 0 10px #db0c2a;
    }

    .list {
        width: 100%;
        max-width: 600px;
    }

    .item {
        background: #111;
        padding: 14px;
        border-radius: 12px;
        margin-bottom: 12px;
        box-shadow: 0 0 10px rgba(255,0,0,0.4);
    }

    .row {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .editable {
        cursor: pointer;
        padding: 4px 0;
    }

    .editable:hover {
        color: #db0c2a;
        text-shadow: 0 0 4px #db0c2a;
    }

    input.inline {
        width: 100%;
        margin: 0;
        padding: 4px;
        background: #222;
        border-radius: 6px;
    }
</style>
</head>

<body>

<h1>MacBanda – Setlist Oficial</h1>

<div class="form-box">
    <label>Música:</label>
    <input id="musica" placeholder="Nome da música" />

    <label>Tom:</label>
    <input id="tom" placeholder="Ex: A, B, C#" />

    <label>Cantor(a):</label>
    <input id="cantor" placeholder="Quem canta" />

    <button onclick="addMusic()">Adicionar Música</button>
</div>

<div class="list" id="list"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyVG73cDRE1bGhtpo6d4xYRSOmmp1XvLSjxRDshOHQ2TFf_WREdxzVUN7MBCC4paM7L/exec";

async function loadList() {
    try {
        const res = await fetch(API);
        const data = await res.json();
        render(data);
    } catch (e) {
        document.getElementById("list").innerHTML = "<div style='color:red;text-align:center;'>Erro ao carregar músicas.</div>";
    }
}

function render(items) {
    const box = document.getElementById("list");
    box.innerHTML = "";

    items.forEach(i => {
        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
            <div class="row">
                <span class="editable" onclick="makeEditable(this, '${i.musica}', 'musica')"><b>Música:</b> ${i.musica}</span>
                <span class="editable" onclick="makeEditable(this, '${i.musica}', 'tom')"><b>Tom:</b> ${i.tom}</span>
                <span class="editable" onclick="makeEditable(this, '${i.musica}', 'cantor')"><b>Cantor:</b> ${i.cantor}</span>
            </div>
        `;

        box.appendChild(div);
    });
}

function makeEditable(span, oldMusica, field) {
    const oldText = span.innerText.split(": ")[1];

    const input = document.createElement("input");
    input.className = "inline";
    input.value = oldText;

    span.replaceWith(input);
    input.focus();

    input.addEventListener("blur", () => {
        saveInlineEdit(oldMusica, field, input.value);
    });
}

async function saveInlineEdit(oldMusica, field, newValue) {
    await fetch(API, {
        method: "POST",
        body: JSON.stringify({
            action: "update",
            oldMusica,
            [field]: newValue
        })
    });

    loadList();
}

async function addMusic() {
    const musica = document.getElementById("musica").value.trim();
    const tom = document.getElementById("tom").value.trim();
    const cantor = document.getElementById("cantor").value.trim();

    if (!musica) return alert("Digite a música.");

    await fetch(API, {
        method: "POST",
        body: JSON.stringify({ action: "add", musica, tom, cantor })
    });

    loadList();
}

loadList();
</script>

</body>
</html>
