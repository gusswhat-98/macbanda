<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MacBanda – Setlist</title>

    <style>
        body {
            background: #000;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.4rem;
            color: #db0c2a;
            text-shadow: 0 0 8px #db0c2a, 0 0 18px #ff002b;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-box {
            background: #111;
            padding: 20px;
            border-radius: 14px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 25px;
            box-shadow: 0 0 18px rgba(219,12,42,0.6);
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 10px;
            color: #fff;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: #222;
            color: #fff;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #db0c2a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 0 10px #db0c2a;
        }

        .list {
            width: 100%;
            max-width: 600px;
        }

        .item {
            background: #111;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(255,0,0,0.4);
        }

        .item span {
            font-size: 1rem;
            color: #fff;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .small-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>MacBanda – Setlist Oficial</h1>

    <div class="form-box">
        <label>Música:</label>
        <input id="musica" placeholder="Nome da música" />

        <label>Tom:</label>
        <input id="tom" placeholder="Ex: A, B, C#" />

        <label>Cantor(a):</label>
        <input id="cantor" placeholder="Quem canta" />

        <button onclick="addMusic()">Adicionar Música</button>
    </div>

    <div class="list" id="list"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyfTpjiMHZMDNd0E5VJtZt3t5t8JR87C4uCKXR8x-8J7Wo5RUo8ZziK1iRdW-iR2fDXpQ/exec";

async function loadList() {
    try {
        const res = await fetch(API);
        const data = await res.json();
        render(data);
    } catch (e) {
        document.getElementById("list").innerHTML =
            "<div style='color:red;text-align:center;'>Erro ao carregar músicas.</div>";
    }
}

function render(items) {
    const box = document.getElementById("list");
    box.innerHTML = "";

    items.forEach(i => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
            <span><b>Música:</b> ${i.musica}</span>
            <span><b>Tom:</b> ${i.tom}</span>
            <span><b>Cantor:</b> ${i.cantor}</span>

            <div class="controls">
                <button class="small-btn" onclick="editMusic('${i.musica}')">Editar</button>
            </div>
        `;
        box.appendChild(div);
    });
}

async function addMusic() {
    const musica = document.getElementById("musica").value.trim();
    const tom = document.getElementById("tom").value.trim();
    const cantor = document.getElementById("cantor").value.trim();

    if (!musica) return alert("Digite a música.");

    await fetch(API, {
        method: "POST",
        body: JSON.stringify({
            action: "add",
            musica,
            tom,
            cantor
        })
    });

    loadList();
}

function editMusic(oldName) {
    const novo = prompt("Novo nome:", oldName);
    const tom = prompt("Novo tom:");
    const cantor = prompt("Novo cantor:");

    updateMusic(oldName, novo, tom, cantor);
}

async function updateMusic(oldMusica, musica, tom, cantor) {
    await fetch(API, {
        method: "POST",
        body: JSON.stringify({
            action: "update",
            oldMusica,
            musica,
            tom,
            cantor
        })
    });

    loadList();
}

loadList();
</script>

</body>
</html>
